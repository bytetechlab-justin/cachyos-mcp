[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cachyos-system"
version = "0.1.0"
description = "Controlled CachyOS workstation administration over official MCP"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "pydantic>=2.13,<3"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.16,<0.17"]
gui = [
    "pyside6>=6.8,<7",
    "tomlkit>=0.13,<1",
]

[project.scripts]
cachyos-system = "cachyos_mcp.server:main"
cachyos-settings = "cachyos_mcp.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cachyos_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
